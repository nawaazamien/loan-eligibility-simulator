name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks, unit tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both Node lines allowed by package.json "engines"; 24 is the .nvmrc default.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit and component tests, with coverage thresholds for the model and reducer
        run: npm run test:coverage
      - name: Upload coverage report
        if: always() && matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7
      - name: Production build
        run: npm run build

  e2e:
    name: Browser tests (production preview)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      # The README's own commands, verbatim (the run adds -d and --name to keep it in the background).
      - name: Build image (README command)
        run: docker build -t loan-eligibility-simulator .
      - name: Check the image holds only the production files
        run: |
          docker run --rm --entrypoint find loan-eligibility-simulator /usr/share/nginx/tally -type f | sort | tee image-files.txt
          if grep -vE '^/usr/share/nginx/tally/(index\.html|favicon\.svg|third-party-notices\.txt|assets/[A-Za-z0-9._-]+\.(js|css|woff2?))$' image-files.txt; then
            echo "Unexpected files in the image (listed above)"; exit 1
          fi
          ! grep -E '\.map$' image-files.txt
      - name: Run container (README command) and check it serves the app and its assets
        run: |
          docker run -d --name app -p 8080:8080 loan-eligibility-simulator
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ > index.html && break; sleep 1; done
          grep -q '<div id="root">' index.html
          test "$(docker inspect app --format '{{.Config.User}}')" = "101"
          test "$(docker exec app id -u)" = "101"
          curl -fsS -o /dev/null http://127.0.0.1:8080/third-party-notices.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/50x.html)" = "404"
          for asset in $(grep -oE '/assets/[^"]+' index.html); do
            curl -fsS -o /dev/null "http://127.0.0.1:8080${asset}"
          done
          curl -fsSI http://127.0.0.1:8080/ > index.headers
          grep -qi '^cache-control: no-cache' index.headers
          grep -qi "^content-security-policy: default-src 'self'" index.headers
          grep -qi '^x-content-type-options: nosniff' index.headers
          grep -qi '^x-frame-options: DENY' index.headers
          grep -qi '^referrer-policy: no-referrer' index.headers
          grep -qi '^permissions-policy: camera=()' index.headers
          asset="$(grep -oE '/assets/[^"]+' index.html | head -n 1)"
          curl -fsSI "http://127.0.0.1:8080${asset}" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/does-not-exist)" = "404"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright against the container
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-container
          path: playwright-report
          retention-days: 7
      - name: Container logs
        if: always()
        run: docker logs app || true
