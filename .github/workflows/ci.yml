name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: Browser tests (production preview)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: loan-eligibility-simulator:ci
      - name: Run container and check it serves the app and its assets
        run: |
          docker run -d --name app -p 8080:8080 loan-eligibility-simulator:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ > index.html && break; sleep 1; done
          grep -q '<div id="root">' index.html
          test "$(docker inspect app --format '{{.Config.User}}')" = "101"
          for asset in $(grep -oE '/assets/[^"]+' index.html); do
            curl -fsS -o /dev/null "http://127.0.0.1:8080${asset}"
          done
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^cache-control: no-cache'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/does-not-exist)" = "404"
      - name: Container logs
        if: always()
        run: docker logs app || true
